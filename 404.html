<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hamza Gamal | 404 - Page Not Found</title>

    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="images/HG.png" type="/image/png" />


    <style>
        /* ///////////////////////////    navbar 🔴    ////////////////////*/

.navbar {
  /* background: rgba(4, 4, 4, 0.8);
  backdrop-filter: blur(10px); */
  animation-name: lettel-top-nav;
  animation-timing-function: linear;
  animation-fill-mode: both;
  animation-duration: auto;
  animation-timeline: scroll();
  animation-range: 0 80px;
  height: 70px;
  width: 100%;
  position: fixed;
  top: 10px;
  border-radius: 20px;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999999999;
  border-bottom: 1px solid transparent;
}
.nav-container {
  max-width: 1400px;
  background: rgba(4, 4, 4, 0.5);
  width: 90%;
  height: 50px;
  animation-name: show-border;
  animation-timing-function: linear;
  animation-fill-mode: both;
  animation-duration: auto;
  animation-timeline: scroll();
  animation-range: 0 80px;
  margin: 0 auto;
  border-radius: 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;
  box-sizing: border-box;
}

.sun,
.moon {
  font-size: large;
  color: #fff;
  transition: var(--main-transition);
  margin-right: 0;
  border-radius: 8px;
  padding: 7px;
  margin-top: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.moon {
  display: none;
  text-align: center;
  margin-top: 6px;
}

.sun:hover,
.moon:hover {
  background-color: rgba(43, 43, 43, 0.5);
  color: var(--main-color);
  cursor: pointer;
}

.hamburger {
  display: none;
}

/* ---- logo (name and image) ----- */

.logo {
  display: flex;
  align-items: center;
  white-space: nowrap;
  font-size: 24px;
  font-family: var(--main-font);
  font-weight: bold;
}

.logo a {
  color: #fff;
  display: flex;
  align-items: center;
  text-decoration: none;
  transition: var(--main-transition);
}

.img-logo {
  width: 120px;
  margin: 0;
  margin-right: -25px;
  align-self: center;
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: 1fr;
  align-items: center;
  justify-items: center;
}
.image-logo {
  grid-area: 1 / 1 / 2 / 2;
  width: 60px;
  padding: 5px;
  max-height: 65px;
  margin-right: -5;
  object-fit: contain;
  transition: var(--main-transition);
  opacity: 0.85;
  animation-name: logonav;
  animation-timing-function: linear;
  animation-fill-mode: both;
  animation-duration: auto;
  animation-timeline: scroll();
  animation-range: 0 80px;
}

.image-logo-2 {
  grid-area: 1 / 1 / 2 / 2;
  width: 50px;
  max-height: 50px;
  margin: 0;
  object-fit: contain;
  opacity: 0.85;
  transition: var(--main-transition);
  animation-name: logonavtwo;
  animation-timing-function: linear;
  animation-fill-mode: both;
  animation-duration: auto;
  animation-timeline: scroll();
  animation-range: 0 80px;
}

.logo:hover a {
  color: var(--main-color);
}

.logo:hover .image-logo-2,
.logo:hover .image-logo {
  /* transform: scale(0.9);
  filter: brightness(0) saturate(100%) invert(16%) sepia(51%) saturate(6524%)
    hue-rotate(357deg) brightness(105%) contrast(128%); */
  opacity: 1;
  transform: scale(0.98);
}

/* ---- links ---- */

.nav-phone {
  display: none;
  position: relative;
}

.nav-links-phone {
  margin: 0;
  padding: 0;
  background-color: #181818;
  position: absolute;
  list-style: none;
  right: 0;
  top: calc(100% + 15px);
  min-width: 200px;
  display: none;
}

.nav-links-phone li a {
  display: block;
  padding: 15px;
  color: #fff;
  transition: var(--main-transition);
}

.nav-links-phone li a:hover {
  color: var(--main-color);
  padding-left: 25px;
}

.nav-links-phone li {
  border-bottom: 1px solid rgb(61, 55, 55);
}

.sun-phone {
  padding: 15px;
  color: #fff;
  transition: var(--main-transition);
  text-align: center;
}

.sun-phone-child {
  border-radius: 7px;
  padding: 5px;
  border: solid 1px #2c2c2c;
  background-color: #131313;
}

.sun-phone span {
  padding-left: 5px;
}

.sun-phone-child:hover {
  color: var(--main-color);
  background-color: #2c2c2c;
}

.nav-links-phone::before {
  content: "";
  border-width: 10px;
  border-style: solid;
  border-color: transparent transparent #181818 transparent;
  position: absolute;
  right: 5px;
  top: -20px;
}

.nav-phone:hover .nav-links-phone {
  display: block;
}

.icon-nav {
  width: 30px;
  display: flex;
  flex-wrap: wrap;
  margin-right: 10px;
  gap: 5px;
  justify-content: flex-end;
}

.icon-nav span:first-child {
  height: 2px;
  width: 100%;
  background-color: #fff;
}

.icon-nav span:nth-child(2) {
  height: 2px;
  transition: var(--main-transition);
  width: 60%;
  background-color: #fff;
}

.icon-nav span:last-child {
  height: 2px;
  background-color: #fff;
  width: 100%;
}

.nav-phone:hover span:nth-child(2) {
  width: 100%;
}

.nav-links {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 30px;
  margin: 0;
  padding: 0;
}

.nav-links li {
  margin: 0;
  padding: 0;
}

.nav-links a {
  color: #fff;
  text-decoration: none;
  font-size: 20px;
  transition: var(--main-transition);
}

.nav-links a:hover {
  color: var(--main-color);
}


        /* ----- */
        
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .error-page h1 {
            font-size: 120px;
            margin: 0;
            color: var(--main-color);
        }

        .error-page p {
            font-size: 24px;
            color: #fff;
        }
    </style>
</head>

<body>

    <header>
        <nav class="navbar">
            <div class="nav-container">

                <div class="logo">
                    <a href="/">
                        <div class="img-logo">
                            <img class="image-logo" src="/images/HG.png" alt="logo">
                            <img class="image-logo-2" src="/images/HG.png" alt="logo">
                        </div>
                        Hamza Gamal
                    </a>
                </div>

                <div class="nav-phone">
                    <span class="icon-nav">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>

                    <div class="nav-links-phone">
                        <li><a href="/">Home</a></li>
                        <li><a href="/#about">About</a></li>
                        <li><a href="/#Services">Services</a></li>
                        <li><a href="/#Projects">Projects</a></li>
                        <li><a href="/#Skills">Skills</a></li>
                        <li><a href="/#Contact">Contact</a></li>
                    </div>
                </div>

                <ul class="nav-links">
                    <li><a href="/">Home</a></li>
                    <li><a href="/#about">About</a></li>
                    <li><a href="/#Services">Services</a></li>
                    <li><a href="/#Projects">Projects</a></li>
                    <li><a href="/#Skills">Skills</a></li>
                    <li><a href="/#Contact">Contact</a></li>

                    <div id="sun" class="sun">
                        <i class="fa-solid fa-sun"></i>
                    </div>

                    <div class="moon">
                        <i class="fa-solid fa-moon"></i>
                    </div>
                </ul>

            </div>
        </nav>
    </header>

    <main class="error-page">
        <h1>404</h1>
        <p>This page could not be found.</p>
    </main>

</body>
</html>
