        margin: 0;
        padding: 0;
      }
      .error-page {
        min-height: 100vh;
        margin-top: 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
      }

      .error-page h1 {
        font-size: 120px;
        margin: 0;
        color: var(--main-color);
        font-weight: 900;
      }

      .error-page p {
        font-size: 24px;
        color: #fff;
        margin: 20px 0;
      }

      .error-page a {
        margin-top: 30px;
      }

      @media (max-width: 768px) {
        .error-page h1 {
          font-size: 60px;
        }

        .error-page p {
