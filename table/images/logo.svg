<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#ef4444" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Red Squircle Base -->
  <rect x="36" y="36" width="440" height="440" rx="110" ry="110" fill="url(#redGrad)" filter="url(#shadow)"/>
  <!-- Highlight Top Border -->
  <rect x="36" y="36" width="440" height="440" rx="110" ry="110" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4"/>
  
  <!-- 3x3 Grid (9 White rounded squares) -->
  <g fill="#ffffff">
    <!-- Row 1 -->
    <rect x="136" y="136" width="64" height="64" rx="12"/>
    <rect x="224" y="136" width="64" height="64" rx="12"/>
    <rect x="312" y="136" width="64" height="64" rx="12"/>
    <!-- Row 2 -->
    <rect x="136" y="224" width="64" height="64" rx="12"/>
    <rect x="224" y="224" width="64" height="64" rx="12"/>
    <rect x="312" y="224" width="64" height="64" rx="12"/>
    <!-- Row 3 -->
    <rect x="136" y="312" width="64" height="64" rx="12"/>
    <rect x="224" y="312" width="64" height="64" rx="12"/>
    <rect x="312" y="312" width="64" height="64" rx="12"/>
  </g>
</svg>
